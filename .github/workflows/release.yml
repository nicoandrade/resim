name: Publish signed macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Check builds, or also sign and notarize without publishing
        type: choice
        options: [check, sign]
        default: check

permissions:
  contents: read

# Serialize releases so an older build cannot replace a newer Latest release.
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source, version and release notes
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-public-repo.py
          python3 scripts/test-github-release.py
          python3 scripts/github-release.py prepare
      - name: Require signing configuration before building a release
        if: github.event_name == 'push' || inputs.mode == 'sign'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = ('DEVELOPER_ID_P12_BASE64', 'DEVELOPER_ID_P12_PASSWORD',
                   'NOTARY_APPLE_ID', 'NOTARY_APP_PASSWORD', 'NOTARY_TEAM_ID')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure GitHub release environment secrets: ' + ', '.join(missing))
          print('Required signing secrets are configured.')
          PY

  build-and-test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v nasm >/dev/null || brew install nasm
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Universal 2 and test on the runner architecture
        run: |
          bash scripts/build.sh
          bash scripts/smoke.sh
          bash scripts/test.sh
          python3 scripts/check-public-repo.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Archive the tested Universal 2 app
        if: matrix.runner == 'macos-15' && (github.event_name == 'push' || inputs.mode == 'sign')
        run: tar -cf "$RUNNER_TEMP/release-app.tar" -C .build/xcode/Build/Products/Release Resim.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.runner == 'macos-15' && (github.event_name == 'push' || inputs.mode == 'sign')
        with:
          name: tested-release-app
          path: ${{ runner.temp }}/release-app.tar
          retention-days: 1
          if-no-files-found: error

  sign-and-publish:
    needs: [prepare, build-and-test]
    if: github.event_name == 'push' || inputs.mode == 'sign'
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tested-release-app
          path: ${{ runner.temp }}/tested-release-app
      - name: Restore the tested app
        run: |
          mkdir -p .build/xcode/Build/Products/Release
          tar -xf "$RUNNER_TEMP/tested-release-app/release-app.tar" -C .build/xcode/Build/Products/Release
      - name: Sign, notarize, staple and verify app and DMG
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: python3 scripts/ci-sign-package.py
      - name: Publish verified assets and update Latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github-release.py publish
      - name: Verify anonymous landing download
        if: github.event_name == 'push'
        run: python3 scripts/github-release.py verify-download
      - name: Signed rehearsal succeeded
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Signed and notarized package verified. No release or tag was created or changed.'
      # Raw signing logs and reports stay on the ephemeral runner, never in artifacts.
      - name: Remove local signing reports and packages
        if: always()
        run: rm -rf .build dist
