name: HEIC runner diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          test -f "$(brew --prefix webp)/lib/libwebp.dylib" || brew install webp
          python3 scripts/diagnose-heic.py
